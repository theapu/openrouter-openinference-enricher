# Portainer-ready stack: OpenRouter Broadcast -> enrich -> Phoenix
#
# Topology (the enricher is INTERNAL — only the collector is exposed):
#   OpenRouter (cloud) -> Caddy (otel.apu.ltd) -> otel-collector :4318 (public)
#        -> enricher :8080 (internal) -> otel-collector :4319 (internal) -> Phoenix
#
# Set these as Portainer stack environment variables:
#   OPENROUTER_INGEST_TOKEN  shared secret OpenRouter sends (Authorization: Bearer ...)
#   PHOENIX_OTLP_ENDPOINT    e.g. http://192.168.255.169:6006/v1/traces
#   PHOENIX_API_KEY          Phoenix System API key
#   IMAGE                    (optional) override the enricher image/tag
#
# Point Caddy at the collector:  otel.apu.ltd { reverse_proxy <host>:4318 }
# OpenRouter Broadcast -> OpenTelemetry Collector dest -> https://otel.apu.ltd/v1/traces
#   header: Authorization = Bearer <OPENROUTER_INGEST_TOKEN>
name: openrouter-enrichment

configs:
  otelcol:
    content: |
      extensions:
        bearertokenauth/openrouter:
          scheme: "Bearer"
          token: "${OPENROUTER_INGEST_TOKEN}"
      receivers:
        otlp/in:          # public ingest from OpenRouter (via Caddy)
          protocols:
            http:
              endpoint: 0.0.0.0:4318
              auth:
                authenticator: bearertokenauth/openrouter
        otlp/back:        # internal: enriched traces coming back from the enricher
          protocols:
            http:
              endpoint: 0.0.0.0:4319
      processors:
        batch: {}
      exporters:
        otlphttp/enrich:
          traces_endpoint: http://enricher:8080/v1/traces
          encoding: json          # hand the enricher easy-to-parse JSON
        otlphttp/phoenix:
          traces_endpoint: ${PHOENIX_OTLP_ENDPOINT}
          headers:
            Authorization: "Bearer ${PHOENIX_API_KEY}"
            x-project-name: "openrouter"
      service:
        extensions: [bearertokenauth/openrouter]
        pipelines:
          traces/in:
            receivers: [otlp/in]
            processors: [batch]
            exporters: [otlphttp/enrich]
          traces/out:
            receivers: [otlp/back]
            processors: [batch]
            exporters: [otlphttp/phoenix]

services:
  enricher:
    image: ${IMAGE:-theapu/openrouter-openinference-enricher:latest}
    container_name: openrouter-enricher
    restart: unless-stopped
    environment:
      FORWARD_URL: "http://otel-collector:4319/v1/traces"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - otel-collector
    # no ports: internal only, reachable by the collector over the stack network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.1   # pin; check for the current tag
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otelcol
        target: /etc/otelcol/config.yaml
    ports:
      - "4318:4318"   # public ingest; put Caddy in front (otel.apu.ltd -> :4318)
